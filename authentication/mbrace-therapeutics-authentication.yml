- path: /wp-json/wp-abilities/v1/abilities
  status: 401
  code: rest_forbidden
  detail: >-
    The WordPress Abilities API namespace is registered on this deployment but returns 401
    anonymously. See mcp/mbrace-therapeutics-mcp.yml — this is the closest thing to an agent-tool
