method: probed
source: live response headers from https://mbracetrx.com/wp-json observed 2026-08-25 + https://mbracetrx.com/robots.txt
note: >-
  MBrace Therapeutics documents no rate limits, because it documents no API. This file records what
  was actually observed at the wire: the deployment returns NO rate-limit headers of any kind, but
  it does enforce an unsignalled edge control that this pass tripped. An honest zero on the
  documented-limits count, with the real runtime behaviour captured alongside it.
limit_count: 0
documented: false
limits: []
response_headers:
  ratelimit_standard: []
  x_ratelimit: []
  retry_after: false
  detail: >-
    No RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset (RFC 9239 style), no X-RateLimit-*,
    and no Retry-After was present on any 200 or any error response observed. An agent gets no
    server-supplied budget signal and no server-supplied backoff signal from this API.
observed_headers_on_200:
