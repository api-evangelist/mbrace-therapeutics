source: openapi/ (9 documents) + live anonymous responses and /wp/v2/types + /wp/v2/taxonomies read 2026-08-25
note: >-
  Entity-relationship graph of the MBrace Therapeutics content API, derived from the registered post
  types and taxonomies the deployment reports about itself and from the id-reference fields actually
  present in live response bodies. The interesting part of this model is not the WordPress core
  types — it is the five custom post types MBrace registered, which make the company's governance
  and cap-table disclosures queryable as structured records.
identifiers:
  scheme: integer
  detail: >-
    Every object is keyed by a site-scoped integer `id`. Identifiers are NOT prefixed or typed, so
    an id is only meaningful together with the collection it came from — id 104 is a media
    attachment, id 2787 is an investor. /wp/v2/search returns {id, type, subtype} precisely so a
    caller can pick the right collection to dereference against.
  slugs: >-
    Every object also carries a `slug`, unique within its type, and every collection accepts
    ?slug= as a lookup. Slugs are the stable human-readable key; ids are the stable machine key.
