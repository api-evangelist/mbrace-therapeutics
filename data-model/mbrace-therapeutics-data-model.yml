graph_notes:
- >-
  The five custom post types are the reason this profile exists. A clinical-stage biotech that
  publishes its board, executive committee, founders, named investors and scientific advisory board
  as five separate JSON collections is emitting a machine-readable governance and cap-table
  disclosure, whether or not it meant to.
- >-
  The graph is shallow and read-only. There are no join entities, no write paths, no state machines
  and no lifecycle transitions — every relationship is a single-hop id reference resolved with a
  second GET.
- >-
  The `acf` (Advanced Custom Fields) bridge is active on every entity above but returned an EMPTY
  array on all of them on 2026-08-25. That is the model's biggest gap: whatever structured fields
  the site editors use to render titles, roles and affiliations are NOT exposed through the API, so
  a consumer must parse `title.rendered` and `content.rendered` HTML to recover them.
- >-
  No entity carries an MBRC programme identifier. The pipeline candidates (MBRC-101, MBRC-201,
  MBRC-301, MBRC-401) exist only as page content, not as a modelled entity — there is no
  /wp/v2/pipeline or /wp/v2/program collection. An agent wanting pipeline data must read the Pages
  API and parse HTML.
