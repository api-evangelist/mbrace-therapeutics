aid: mbrace-therapeutics
name: MBrace Therapeutics
description: >-
  MBrace Therapeutics is a privately held, clinical-stage biopharmaceutical company developing
  antibody-drug conjugates (ADCs) against novel oncology targets. Co-founded by Renata Pasqualini,
  Ph.D. and Isan Chen, MD, the company builds its pipeline on SPARTA, an in vivo antibody selection
  and target discovery process it uses to find ADC targets that conventional in vitro discovery
  misses. Its lead candidate MBRC-101 is an anti-EphA5 monomethyl auristatin E (MMAE) antibody-drug
  conjugate in a multi-centre, open-label Phase 1/1b dose-finding, safety and pharmacokinetic study
  in advanced refractory solid tumours; MBRC-201 is in Phase 2, MBRC-301 is in IND-enabling studies
  against solid tumours, and MBRC-401 is in discovery. MBrace emerged from stealth in November 2023
  with an $85 million Series B led by TPG through TPG Life Sciences Innovations, alongside Avidity
  Partners, Blue Owl Capital, Venrock and Alta Partners, bringing total capital raised to $110
  million. MBRC-101 was named Most Promising Clinical Candidate at the 11th Annual World ADC Awards.
  MBrace Therapeutics runs no developer program and publishes no product API, developer portal, API
  reference or SDK. The only machine-readable surface reachable without credentials is the WordPress
  REST content API behind mbracetrx.com, catalogued here — notable because the company registered
  five of its own custom post types, so its board, executive committee, founders, named investors and
  scientific advisory board are all published as structured JSON rather than only as rendered HTML.
